<!doctype html><!-- Copyright 2026 上海如静知华信息科技有限公司 --><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华 JSONLab</title><link rel="stylesheet" href="style.css"></head><body><header><b>ZhuaTech JSONLab</b><span>JSON 数据工作台</span><a href="https://www.zhuatech.cn/">知华科技</a></header><main><section><label>输入 JSON</label><textarea id="source">{"company":"知华科技","tools":["format","inspect"]}</textarea><button id="run">校验并分析</button></section><section><div class="metrics" id="metrics"><i>等待分析</i></div><pre id="result">格式化结果将在这里显示</pre></section></main><script>const api='http://localhost:8080/api/jsonlab/inspect';run.onclick=async()=>{result.textContent='分析中…';try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:source.value})}).then(x=>x.json());metrics.innerHTML=`<strong>${r.valid?'有效 JSON':'语法错误'}</strong><span>${r.rootType}</span><span>${r.nodeCount} 节点</span><span>${r.maxDepth} 层</span>`;result.textContent=r.normalized||r.error}catch(e){result.textContent='请确认后端服务已启动'}};</script></body></html>
