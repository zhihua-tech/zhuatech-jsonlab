services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhuatech_jsonlab
      MYSQL_USER: zhuatech
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ZhuaTech-Local-2026!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ZhuaTech-Root-Local-2026!}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["jsonlab_mysql:/var/lib/mysql", "./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
volumes: {jsonlab_mysql: {}}
